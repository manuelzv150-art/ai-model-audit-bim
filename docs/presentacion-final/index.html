<main id="stage" aria-live="polite"><section aria-label="Diapositiva 1: Portada"><img src="slides/01.png" alt="Diplomado Internacional · IA en Ingeniería y Construcción · Ed.03 · Ruta Startup — AI model audit — Revisión de entregas BIM con IA: qué cambió, qué falta y si lo acordado se cumplió Grupo 20 · Manuel Daniel Bencomo Rojas · Rainer Luice Murrieta Huaranca · 19/11/2026 — Entrega final · 17 de noviembre · Presentación · 19 de noviembre" width="1920" height="1080" decoding="async"><figure class="hero"><video class="clip hero-v" src="avance_modelo.mp4" poster="avance_portada.jpg" muted loop playsinline autoplay preload="auto" aria-label="Video del módulo Avance del modelo: entrega, alcance contra lo aprobado, reglas propuestas por la IA, visor 3D con el retroceso de M-01 y reporte"></video><figcaption><span class="dot"></span>Módulo · Avance del modelo</figcaption></figure></section><section aria-label="Diapositiva 2: Problema y usuario"><img src="slides/02.png" alt="Startup · Problema y segmento — Problema y usuario — El problema — •  Revisar una entrega BIM es manual: 22,5 h de mediana por auditoría (rango 9–36 h) •  6 de 6 empresas entrevistadas tuvieron retrabajo en los últimos 3 meses •  Caso real AICC: el modelo creció 74% y el cumplimiento bajó de 37,1% a 33,5% •  Por qué ahora: BIM obligatorio en 14 tipologías de inversión pública desde agosto de 2026 [F1] — El usuario y el cliente — •  Usuario: coordinador BIM que revisa modelos de terceros contra el BEP (6/6 tienen BEP) •  Paga: director o gerente de consultoras BIM y de ingeniería de Lima •  Hoy usa Navisworks (5 de 6), que detecta choques pero no compara información •  Desde el Hito 1: foco en la información que se pierde y en los retrocesos" width="1920" height="1080" decoding="async"></section><section aria-label="Diapositiva 3: Solución y valor AEC"><img src="slides/03.png" alt="Startup · Solución e IA — Solución y valor AEC — Qué resuelve Compara dos versiones IFC contra el BEP y las actas y mues ;width:43.349%;height:43.352%"></video></section><section aria-label="Diapositiva 6: Pruebas"><img src="slides/06.png" alt="Startup · Pruebas — Pruebas — Caso ejecutado · Criterio de aceptación · Resultado · Corrección aplicada — Prueba B · 6 usuarios, 6 tareas sin ayuda · ≥ 80% de éxito en T1–T4 y SEQ ≥ 5,5 · 36/36 logradas · SEQ 6,3 · T5 con dudas → etiqueta CHOQUE DURO / FALTA DE HOLGURA — Prueba D · motor vs. IfcOpenShell e ifctester (MARIAN) · Mismos veredictos que la referencia · 88/88 información · 92/92 IDS · choques: precisión 100% · Holgura entre muros 13,8% → medición en malla (fase 1) — Prueba E · reglas con Gemini en vivo · ≥ 80% de reglas útiles · 14 de 15 (93%); IDS desde texto 5/5 · Aprobación humana obligatoria; esquema JSON cerrado — Prueba F · asistente IA (12 preguntas, 3 rondas) · 0 cifras inventadas y ≥ 11/12 · 10/12 → 10/12 → 12/12 · Respuesta «sin dato» + ficha verificada — Casos reales AICC y MARIAN (4 IFC) · Leer IFC reales de hasta 66 MB · Lectura 1,3 s · choques 2,5 s · Separar «resuelta» de «eliminada» (14/14 eran eliminadas)" width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 7: Resultados"><img src="slides/07.png" alt="Startup · Resultados — Resultados — Usabilidad 36/36 tareas sin ayuda · meta ≥ 80% · utilidad 4,7/5 — IA útil 93% reglas útiles con Gemini · meta ≥ 80% · asistente 12/12 — Calidad del motor 100% precisión vs. IfcOpenShell e ifctester · lectura de IFC en 2,5 s — Lectura crítica La calidad técnica y la usabilidad están probadas. La línea base de negocio es la auditoría manual de 22,5 h: el ahorro frente a ella (H2) todavía no se mide en un piloto real." width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 8: Validación con el segmento"><img src="slides/08.png" alt="Startup · Validación — Validación con el segmento — Entrevistas y encuestas 11 profesionales: 6 entrevistas + 5 encuestas tras la demo; 5 aceptan el piloto y 5 lo condicionan — Hipótesis de precio 3 de 8 respuestas válidas ponen US$ 180 en su rango (meta 70%): no se confirma — Decisión del equipo 2 planes US$ 180 para consultoras (3 pilotos aceptados) · US$ 50 Profesional (5 de 5 en rango)" width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 9: Mercado y modelo de negocio"><img src="slides/09.png" alt="Startup · Mercado y negocio — Mercado y modelo de negocio — TAM · SAM · SOM 308 · 103 · 20 proyectos en Lima: US$ 665 280 · 222 480 · 36 000 al año [F3] — Unidad económica US$ 152 contribución por proyecto de consultora; equilibrio con 15 + 15 proyectos (fijos US$ 2 907) — Competencia y ventaja BCF 2.1 Navisworks (≈ US$ 2 000/año, 5 de 6 lo usan) detecta choques pero no datos: lo complementamos" width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 10: Evolución del proyecto"><img src="slides/10.png" alt="Startup · Evolución — Evolución del proyecto — Hito 1 Problema, segmento y mercado con fuentes; valor en dos capas: motor verificable + IA — Hito 2 6 entrevistas y prototipo publicado: retrocesos primero, SAM de 50% a 33%, aprobación obligatoria — Hito 3 IA en vivo, inicio de sesión y asistente (12/12); 8 respuestas de precio → dos planes" width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 11: Limitaciones"><img src="slides/11.png" alt="Startup · Limitaciones — Limitaciones — Lo que no resuelve todavía — •  Holgura entre muros: exhaustividad 13,8% (cajas envolventes) •  Requisitos que no viajan en el IFC quedan «No evaluable» •  Ahorro (H2) y soporte (H5) sin medir: 0 pilotos firmados •  Plan Profesional depende de soporte autoservicio (supuesto de 0,5 h) — Condiciones para usarlo — •  Consultoras con BEP o actas e IFC exportado (hoy solo 2 de 6 trabajan con IFC) •  Navegador moderno; el modelo IFC no sale del equipo •  Toda regla de la IA requiere aprobación del coordinador •  Prototipo: inicio de sesión local; datos sintéticos en el caso de ejemplo" width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 12: Próximos pasos y solicitud"><img src="slides/12.png" alt="Startup · Próximos pasos y solicitud — Próximos pasos y solicitud — Ahora · nov–dic 2026 Solicitud: 2 pilotos pagados de 1 proyecto a US$ 180/mes; medir ahorro (≥ 30%) y soporte (≤ US$ 60) — Siguiente versión · ene–mar 2027 Holgura en malla; separar «resuelta» y «eliminada»; cuentas multiusuario; guía de exportación IFC — Escalar · 2027 5 empresas y 20 proyectos activos = equilibrio; complemento Revit; canal de referidos" width="1920" height="1080" loading=lazy decoding="async"></section><section aria-label="Diapositiva 13: Equipo y contacto"><img src="slides/13.png" alt="Startup · Equipo — Equipo y contacto — •  Manuel Daniel Bencomo Rojas · coordinador BIM: entrevistas, producto y demo · manuelzv150@gmail.com •  Rainer Luice Murrieta Huaranca · especialista BIM: entrevistas, validación y modelo de negocio · rainerlmh11@gmail.com •  Demo: manuelzv150-art.github.io/ai-model-audit-bim/interferencias/ •  Presentación web: manuelzv150-art.github.io/ai-model-audit-bim/presentacion/" width="1920" height="1080" loading=lazy decoding="async"></section></main>
<div id="bar"></div>
<nav id="hud" aria-label="Navegación"><button id="prev" aria-label="Diapositiva anterior">←</button><span id="num"></span><button id="next" aria-label="Diapositiva siguiente">→</button><button id="fs" aria-label="Pantalla completa">⛶</button></nav>
<script>
(()=>{
const st=document.getElementById('stage'), S=[...st.children], num=document.getElementById('num'), bar=document.getElementById('bar');
let i=0;
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);st.style.transform=`translate(${-960*k}px,${-540*k}px) scale(${k})`;}
function show(n){
  n=Math.max(0,Math.min(S.length-1,n));
  S.forEach((s,j)=>{s.classList.toggle('on',j===n);s.querySelectorAll('video').forEach(v=>{if(j===n){v.currentTime=0;v.play().catch(()=>{})}else v.pause()})});
  if(S[n+1]) S[n+1].querySelector('img').loading='eager';
  i=n; num.textContent=(n+1)+' / '+S.length; bar.style.width=((n+1)/S.length*100)+'%';
  history.replaceState(null,'','#'+(n+1));
}
const next=()=>show(i+1), prev=()=>show(i-1);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='Home') show(0); else if(e.key==='End') show(S.length-1);
  else if(e.key==='f'||e.key==='F') toggleFs();
});
st.addEventListener('click',e=>{ if(e.target.tagName==='VIDEO'){const v=e.target; v.paused?v.play():v.pause(); return;} next(); });
let x0=null; addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(x0===null)return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40)(dx<0?next:prev)(); x0=null;});
function toggleFs(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}
document.getElementById('next').onclick=e=>{e.stopPropagation();next();};
document.getElementById('prev').onclick=e=>{e.stopPropagation();prev();};
document.getElementById('fs').onclick=e=>{e.stopPropagation();toggleFs();};
addEventListener('resize',fit); fit();
show((parseInt(location.hash.slice(1))||1)-1);
})();
</script></body></html>
